name: 'Terraform GCP Portfolio Backend Deployment - CI/CD'

# This guarantees only one run happens at a time, queueing any new commits
concurrency:
  group: terraform-production
  cancel-in-progress: false

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action (apply or destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  # The GCP project ID is injected here via GitHub Secrets.
  # Terraform will automatically pick this up if mapped correctly, or we can pass it as a TF_VAR.
  TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
  
jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Best practice for GCP Authentication is Workload Identity Federation,
    # but for simplicity, you can use a Service Account JSON Key stored in secrets.
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Ensure Terraform State Bucket Exists
      run: |
        # Generate a globally unique bucket name using the Project ID
        BUCKET_NAME="dbplay-${{ secrets.GCP_PROJECT_ID }}-tf-state"
        
        echo "Checking if bucket gs://$BUCKET_NAME exists..."
        # If the bucket doesn't exist (returns error), create it. Similar to UPSERT.
        if ! gcloud storage buckets describe gs://$BUCKET_NAME &>/dev/null; then
          echo "Bucket does not exist. Creating..."
          gcloud storage buckets create gs://$BUCKET_NAME --location=US
        else
          echo "Bucket already exists."
        fi
        
        echo "Injecting bucket name into main.tf..."
        sed -i "s/__BACKEND_BUCKET_NAME__/$BUCKET_NAME/g" main.tf

    - name: Enable Required GCP APIs
      run: |
        echo "Enabling necessary GCP APIs..."
        gcloud services enable \
          cloudresourcemanager.googleapis.com \
          sqladmin.googleapis.com \
          servicenetworking.googleapis.com \
          compute.googleapis.com

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan
      if: github.event.inputs.action != 'destroy' && github.ref != 'refs/heads/main'

    - name: Terraform Apply
      if: github.event.inputs.action != 'destroy' && github.ref == 'refs/heads/main'
      run: terraform apply -auto-approve

    - name: Force Cleanup Cloud Run & IPs (Before Destroy)
      if: github.event.inputs.action == 'destroy'
      run: |
        echo "Force deleting Cloud Run services..."
        gcloud run services delete dbexp-backend-west --region us-west1 --quiet || true
        gcloud run services delete dbexp-backend-east --region us-east1 --quiet || true
        
        echo "Force deleting locked Serverless IPs..."
        gcloud compute addresses delete serverless-ipv4-1787707427824078083 --region us-west1 --quiet || true
        gcloud compute addresses delete serverless-ipv4-1787707453921867123 --region us-east1 --quiet || true

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: terraform destroy -auto-approve
