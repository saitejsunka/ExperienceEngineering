syntax = "proto3";

package dbexp.v1;

option go_package = "dbexp/backend/stubs;stubs";

// DBExpService defines the backend APIs for interacting with the database.
service DBExpService {
  // 1. Health check API
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);

  // 2. UpsertPost API
  rpc UpsertPost(UpsertPostRequest) returns (UpsertPostResponse);

  // 3. ReadPost API
  rpc ReadPost(ReadPostRequest) returns (ReadPostResponse);
}

// --- Health Check ---

message CheckHealthRequest {}

message CheckHealthResponse {
  // Standard HTTP-like status codes: 200 (Success), 500 (Internal Error)
  int32 status_code = 1;
  string message = 2;
}

// --- Upsert Post ---

message UpsertPostRequest {
  string post_id = 1;
  string title = 2;
  string content = 3;
  string author = 4;
}

message UpsertPostResponse {
  // Standard HTTP-like status codes: 200 (Success), 500 (Internal Error)
  int32 status_code = 1;
  string message = 2;
}

// --- Read Post ---

message ReadPostRequest {
  string post_id = 1;
}

message ReadPostResponse {
  // Standard HTTP-like status codes: 200 (Success), 500 (Internal Error)
  int32 status_code = 1;
  
  // Post data (empty if status_code is 500)
  string post_id = 2;
  string title = 3;
  string content = 4;
  string author = 5;
}
